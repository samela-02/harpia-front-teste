<div class="modal">
  <div class="header">
    <div class="modal-header">
      <i [class]="'la la-camera-retro'" class="text-[27px] flex justify-center text-primary"></i>
      <span class="flex-center text-lg font-semibold text-text">
       Detecção
      </span>
    </div>
    <div class="modal-close">
      <tvc-button icon="close" color="link" class="opacity-50" (click)="fecharModal()" />
    </div>
  </div>
  <div class="main">
        <mat-tab-group>
          <mat-tab label="Evento">
            <div class="min-h-[400px] mt-1 w-full grid grid-cols-2 gap-2">
              <div class="h-full">
                <map-markers class="w-full h-full shadow-md"></map-markers>
              </div>
              <div class="h-full w-full flex-col flex gap-2">
                <div class="h-[20vh] min-w-full">
                  <div *ngIf="deteccao?.imgOriginal" class="img-container">
                    <div [style.background-color]="getColorByNivel(5)" class="w-[3%] h-full rounded-l-md"></div>
                    <img *ngIf="deteccao?.imgOriginal" [src]="'data:image/' + deteccao?.imgEncoding + ';base64,' + deteccao?.imgOriginal"
                      alt="Imagem do evento" class="img-captura h-full w-[97%] shadow-md">
                  </div>
                </div>
                <div class="flex flex-col gap-4 mt-3">
                  <app-card-details titulo="Detecção" icone="la la-camera-retro">
                    <div class="h-full w-full flex-col flex text-primary text-sm">
                      <span class="flex items-start gap-1">
                        <i [class]="'la la-star-half-alt'" class="mt-[2px]"></i>
                        <span>
                          <strong>
                            Nível:
                          </strong>
                          <span [style.background-color]="getColorByNivel(5)"
                            style="display: inline-block; width: 10px; height: 10px; border-radius: 50%;">
                          </span>
                          Furto/Roubo
                        </span>
                      </span>

                      <app-info-line [descricao]="(deteccao.dtDeteccao | date:'dd/MM/yyy HH:mm:ss') || 'N/A'" [icone]="'la la-calendar'"
                        titulo="Data"></app-info-line>
                    </div>
                  </app-card-details>
                  <app-card-details titulo="Veículo" icone="la la-car-alt">
                      <div class="h-full w-full flex-col flex text-primary text-sm">
                      <app-info-line titulo="Placa" icone="la la-tag" [descricao]="deteccao?.nmPlaca ? deteccao?.nmPlaca : 'N/A'" />
                      <app-info-line titulo="Modelo" icone="la la-truck-pickup" descricao="Polo Sedan"/>
                      <app-info-line titulo="Marca" icone="la la-plus-square" descricao="Volkswagen" />
                      <app-info-line titulo="Cor" icone="la la-brush" descricao="Azul" />
                      <app-info-line titulo="Ano" icone="la la-sort-numeric-up-alt" descricao="1925" />
                    </div>
                    </app-card-details>
                </div>
              </div>
            </div>
          </mat-tab>
          <mat-tab label="Mais detalhes">

          </mat-tab>
        </mat-tab-group>
  </div>
</div>-
