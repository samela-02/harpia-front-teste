<form [formGroup]="formGroup" class="mt-2 form h-full flex flex-col justify-between gap-3">
    <tvc-dropdown class="w-full" id="cdMotivoRejeicao" formControlName="cdMotivoRejeicao" useLabel="dsMotivoRejeicao"
    useValue="cdMotivoRejeicao" label="Motivo de rejeição" placeholder="Motivo de rejeição" required [providers]="motivosRejeicao" />

    <tvc-input class="w-full" id="dsMovimentacaoDeteccao" formControlName="dsMovimentacaoDeteccao" label="Descrição da rejeição"
    placeholder="Descrição da rejeição" inputNormalize="alfanum" required [maxlength]="500" [minlength]="3" />

    <div class="flex justify-end">
        <button (click)="onSubmit()" [disabled]="!formGroup.valid"
          mat-flat-button
          class="px-4 py-2 rounded-md bg-primary/10 dark:bg-dark-primary/10 text-primary dark:text-dark-primary disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-primary/50">
          <i class="text-lg la la-save"></i>
          <span class="pt-1">
            Salvar
          </span>
        </button>
    </div>
</form>
