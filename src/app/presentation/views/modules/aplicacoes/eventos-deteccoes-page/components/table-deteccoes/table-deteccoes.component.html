<div class=" table-container border-b border-primary/5 rounded-lg">
  <table mat-table [dataSource]="deteccoes?.dados" class="table">

    <ng-container matColumnDef="imgOriginal">
      <th mat-header-cell *matHeaderCellDef>DETECÇÃO</th>
      <td mat-cell *matCellDef="let item" class="uppercase columns">
        <div class="h-[11vh] min-w-[20vh] my-1">
          <div *ngIf="item?.imgOriginal" class="img-container">
            <div [style.background-color]="getColorByNivel(item?.tpNivelAlerta)" class="w-1/12 h-full rounded-l-md"></div>
            <img *ngIf="item?.imgOriginal" [src]="'data:image/' + item.imgEncoding + ';base64,' + item.imgOriginal"
              alt="Imagem do evento" class="img-captura w-11/12">
          </div>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="nrPlaca">
      <th mat-header-cell *matHeaderCellDef>PLACA</th>
      <td mat-cell *matCellDef="let item" class="uppercase columns">
        <div class="row-container">
          <modelo-placa class="w-40 scale-75 lg:scale-100" [nrPlaca]="item.nrPlaca" />
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="idEquipamento">
      <th mat-header-cell *matHeaderCellDef> ID EQUIPAMENTO </th>
      <td mat-cell *matCellDef="let dados"> {{dados.idEquipamento}} </td>
    </ng-container>

    <ng-container matColumnDef="dtDeteccao">
      <th mat-header-cell *matHeaderCellDef> DATA DA DETECÇÃO </th>
      <td mat-cell *matCellDef="let dados">
        <tvc-badge color="default" size="normal">
          {{dados.dtDeteccao | date: 'dd/MM/yyyy HH:mm:ss'}}
        </tvc-badge>
      </td>
    </ng-container>

    <ng-container matColumnDef="dtDelecao">
      <th class="text-center" mat-header-cell *matHeaderCellDef> DATA DA REJEIÇÃO</th>
      <td class="text-center" mat-cell *matCellDef="let dados">
        @if (dados.dtDelecao) {
          <tvc-badge class="w-full" color="default" size="normal">
            {{ dados.dtDelecao | date: 'dd/MM/yyyy HH:mm:ss' }}
          </tvc-badge>
        } @else {
          {{ '-' }}
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <no-table [dataSource]="deteccoes" />

  <mat-paginator *ngIf="deteccoes?.dados?.length == pageSize || pageIndex != 0" [length]="dataLength"
    [pageSizeOptions]="[5, 10]" [pageSize]="pageSize" (page)="onPageChange($event)" aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
</div>
