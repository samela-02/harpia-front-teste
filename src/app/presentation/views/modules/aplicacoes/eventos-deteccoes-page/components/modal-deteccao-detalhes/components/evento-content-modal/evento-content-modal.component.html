<div class=" mt-1 w-full grid grid-cols-2 gap-2 h-full">
  <div class="h-full">
    <map-markers class="w-full h-full shadow-md"></map-markers>
  </div>
  <div class="h-full w-full flex-col flex">
    <div class="h-[20vh] min-w-full">
      <div *ngIf="deteccao?.imgOriginal" class="img-container w-full">
        <img [style.border-color]="getColorByNivel(5)" (click)="openModal($event, deteccao)" *ngIf="deteccao?.imgOriginal"
          [src]="'data:image/' + deteccao?.imgEncoding + ';base64,' + deteccao?.imgOriginal" alt="Imagem do evento"
          class="img-captura h-full w-full shadow-md border-l-[15px]">
      </div>
    </div>
    <div class="flex flex-col gap-4 mt-3">
      <app-card-details titulo="Detecção" icone="la la-camera-retro">
        <div class="h-full w-full flex-col flex text-primary text-sm">
          <span class="flex items-start gap-1">
            <i [class]="'la la-star-half-alt'" class="mt-[2px]"></i>
            <span>
              <strong>
                Nível:
              </strong>
              <span [style.background-color]="getColorByNivel(5)"
                style="display: inline-block; width: 10px; height: 10px; border-radius: 50%;">
              </span>
              Furto/Roubo
            </span>
          </span>
          <app-info-line [descricao]="(deteccao.dtDeteccao | date:'dd/MM/yyy HH:mm:ss') || 'N/A'"
            [icone]="'la la-calendar'" titulo="Data"></app-info-line>
        </div>
      </app-card-details>
      <app-card-details titulo="Veículo" icone="la la-car-alt">
        <div class="h-full w-full flex-col flex text-primary text-sm">
          <app-info-line titulo="Placa" icone="la la-tag" [descricao]="deteccao?.nrPlaca ? deteccao?.nrPlaca : 'N/A'" />
          <app-info-line titulo="Modelo" icone="la la-truck-pickup" descricao="Polo Sedan" />
          <app-info-line titulo="Marca" icone="la la-plus-square" descricao="Volkswagen" />
          <app-info-line titulo="Cor" icone="la la-brush" descricao="Azul" />
          <app-info-line titulo="Ano" icone="la la-sort-numeric-up-alt" descricao="1925" />
        </div>
      </app-card-details>
    </div>
  </div>
</div>
