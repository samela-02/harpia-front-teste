<div class="p-2">

        <span class="flex-center text-lg font-semibold text-text dark:text-cyan-50 ">
         Rejeitar detecção
        </span>
      </div>
      <div class="modal-close">
        <tvc-button icon="close" color="link" class="opacity-50" (click)="fecharModal()" />
      </div>
    </div>
    <div class="main">
        <app-form-rejeicao-deteccao [cdDeteccao]="deteccao.cdDeteccao" (rejeitadoComSucesso)="fecharTodosModais()"></app-form-rejeicao-deteccao>
    </div>
  </div>-
</div>
