<div class="page h-full flex flex-col gap-2">
  <div class="w-full flex flex-row justify-end">
    <div class="flex-center gap-3">
      <app-filters-inputs [formGroup]="formGroup" searchField="nmUsuario" placeholder="Pesquisar usuário"
        (search)="onSearch()">
        <app-filter-usuario [formGroup]="formGroup" [table]="table()" />
      </app-filters-inputs>
      <button mat-flat-button (click)="cadastrar()" class="button-actions">
        <i [class]="icon" class="text-lg"></i>
        <label class="md:flex hidden dark:text-cyan-50">
          Cadastrar Usuário
        </label>
      </button>
    </div>
  </div>
  <app-table-usuarios [formGroup]="formGroup" class="overflow-x-auto overflow-y-hidden"></app-table-usuarios>
</div>
