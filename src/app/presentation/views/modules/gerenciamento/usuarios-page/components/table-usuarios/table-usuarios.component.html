<div class="table-container max-h-[37em]">
  <table mat-table [dataSource]="usuarios()?.data?.dados" class="table" [style.width]="'100%'" [style.table-layout]="'fixed'" style="min-width: 600px;">

    <ng-container matColumnDef="nmUsuario">
    <th mat-header-cell *matHeaderCellDef> NOME </th>
    <td mat-cell *matCellDef="let dados">
      <span class="font-bold">
        {{dados?.nmUsuario}}
      </span>
     </td>
    </ng-container>

    <ng-container matColumnDef="nmEmail">
      <th mat-header-cell *matHeaderCellDef> EMAIL </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.nmEmail}} </td>
    </ng-container>

    <ng-container matColumnDef="nmCargo">
      <th mat-header-cell *matHeaderCellDef> CARGO </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.nmCargo}} </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Nível </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.roleLabel || dados?.role}} </td>
    </ng-container>

    <ng-container matColumnDef="lgAtivo">
      <th mat-header-cell *matHeaderCellDef>Situação</th>
      <td mat-cell *matCellDef="let dados">
        <mat-chip-set>
          <mat-chip [class.chip-success]="dados.lgAtivo" [class.chip-danger]="!dados.lgAtivo">
            <i [class.content-success]="dados.lgAtivo" [class.content-danger]="!dados.lgAtivo" class="la la-check-circle" matChipAvatar *ngIf="dados.lgAtivo">
            </i>
            <i [class.content-success]="dados.lgAtivo" [class.content-danger]="!dados.lgAtivo" class="la la-times-circle" matChipAvatar *ngIf="!dados.lgAtivo">
            </i>
            <span [class.content-success]="dados.lgAtivo" [class.content-danger]="!dados.lgAtivo">
              {{ getSituacao(dados.lgAtivo) || "" }}
            </span>
          </mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <no-table [dataSource]="usuarios()?.data?.dados" />

  <mat-paginator
   *ngIf="usuarios()?.data?.dados.length == pageSize || pageIndex != 0"
    [length]="dataLength"
    [pageSizeOptions]="[5, 10]"
    [pageSize]="pageSize"
    (page)="onPageChange($event)"
    aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
</div>
