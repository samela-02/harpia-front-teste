<div class="table-container">
  <table mat-table [dataSource]="veiculosCCO().data.dados" class="table" [style.width]="'100%'" [style.table-layout]="'fixed'" style="min-width: 600px;">

    <ng-container matColumnDef="idVeiculo">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let dados">
      <span class="font-bold">
        {{dados?.idVeiculo}}
      </span>
     </td>
    </ng-container>

    <ng-container matColumnDef="nrPlaca">
      <th mat-header-cell *matHeaderCellDef>PLACA</th>
      <td mat-cell *matCellDef="let item" class="uppercase columns">
        <div class="row-container">
          <modelo-placa class="w-40 scale-75 lg:scale-100 my-1" [nrPlaca]="item.nrPlaca" />
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="nmMarca">
      <th mat-header-cell *matHeaderCellDef> MARCA </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.nmMarca ? dados?.nmMarca : 'N/A'}} </td>
    </ng-container>

    <ng-container matColumnDef="nmModelo">
      <th mat-header-cell *matHeaderCellDef> MODELO </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.nmModelo}} </td>
    </ng-container>

    <ng-container matColumnDef="corVeiculo">
      <th mat-header-cell *matHeaderCellDef> COR </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.corVeiculo}} </td>
    </ng-container>

    <ng-container matColumnDef="dtDelecao">
      <th mat-header-cell *matHeaderCellDef> DATA DELEÇÃO</th>
      <td mat-cell *matCellDef="let dados">
        <tvc-badge color="default" size="normal">
          {{dados.dtDelecao | date: 'dd/MM/yyyy HH:mm:ss'}}
        </tvc-badge>
      </td>
    </ng-container>

    <ng-container matColumnDef="lgAtivo">
      <th mat-header-cell *matHeaderCellDef>Situação</th>
      <td mat-cell *matCellDef="let dados">
        <app-chip-status [lgAtivo]="dados.lgAtivo"></app-chip-status>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <no-table [dataSource]="veiculosCCO()?.data?.dados" />

  <mat-paginator
    *ngIf="veiculosCCO()?.data?.dados.length == pageSize || pageIndex != 0"
    [length]="dataLength"
    [pageSizeOptions]="[5, 10]"
    [pageSize]="pageSize"
    (page)="onPageChange($event)"
    aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
</div>
