<div class="flex flex-col gap-3">
  <div class="flex flex-col gap-4" [formGroup]="formGroup">
    <div class="flex flex-row gap-4">
      <div class="flex flex-col gap-2 w-full">

        <tvc-input id="nmMarca" label="Marca" formControlName="nmMarca" maxlength="40" />

        <tvc-input id="nmModelo" label="Modelo" formControlName="nmModelo" maxlength="40" />
      </div>
    </div>
    <div class="flex justify-end">
      <div class="flex items-center gap-2">
        <tvc-button color="default" icon="cleaning_services" matTooltip="Limpar" (click)="limpar()" />
        <tvc-button color="primary" icon="search" matTooltip="Pesquisar" (click)="pesquisar()"/>
      </div>
    </div>
  </div>
</div>
