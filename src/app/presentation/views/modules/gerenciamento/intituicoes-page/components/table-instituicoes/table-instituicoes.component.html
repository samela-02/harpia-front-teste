<div class="table-container">
  <table mat-table [dataSource]="instituicoes().data.dados" class="table" [style.width]="'100%'" [style.table-layout]="'fixed'" style="min-width: 600px;">

    <ng-container matColumnDef="idInstituicao">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let dados">
      <span class="font-bold">
        {{dados?.idInstituicao}}
      </span>
     </td>
    </ng-container>

    <ng-container matColumnDef="nmInstituicao">
      <th mat-header-cell *matHeaderCellDef> NOME </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.nmInstituicao ? dados?.nmInstituicao : '-'}} </td>
    </ng-container>

    <ng-container matColumnDef="txtObservacao">
      <th mat-header-cell *matHeaderCellDef> OBSERVAÇÃO </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.txtObservacao ? dados?.txtObservacao : 'N/A'}} </td>
    </ng-container>

    <ng-container matColumnDef="nmCidade">
      <th mat-header-cell *matHeaderCellDef> CIDADE </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.nmCidade}} </td>
    </ng-container>

    <ng-container matColumnDef="lgAtivo">
      <th mat-header-cell *matHeaderCellDef>Situação</th>
      <td mat-cell *matCellDef="let dados">
        <mat-chip-set>
          <app-chip-status [lgAtivo]="dados?.lgAtivo"/>
        </mat-chip-set>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <no-table [dataSource]="instituicoes()?.data?.dados" />

  <mat-paginator
    *ngIf="instituicoes()?.data?.dados.length == pageSize || pageIndex != 0"
    [length]="dataLength"
    [pageSizeOptions]="[5, 10]"
    [pageSize]="pageSize"
    (page)="onPageChange($event)"
    aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
</div>
