<div class="page h-full flex flex-col gap-2">
  <div class="w-full flex flex-row justify-end">
    <div class="flex-center gap-3">
      <app-filters-inputs
        [formGroup]="formGroup"
        searchField="nmInstituicao"
        placeholder="Pesquisar instituição"
        (search)="onSearch()">
        <app-filter-instituicao [formGroup]="formGroup" [table]="table()" />
      </app-filters-inputs>
      <button mat-flat-button (click)="cadastrar()" class="font-semibold bg-primary/10 text-primary">
        <i [class]="icon" class="text-lg"></i>
        <label class="md:flex hidden">
          Cadastrar Instituição
        </label>
      </button>
    </div>
  </div>
  <app-table-instituicoes [formGroup]="formGroup" class="overflow-x-auto overflow-y-hidden"></app-table-instituicoes>
</div>
