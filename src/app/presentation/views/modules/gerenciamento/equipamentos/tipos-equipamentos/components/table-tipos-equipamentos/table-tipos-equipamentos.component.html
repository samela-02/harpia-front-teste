<div class="table-container">
  <table mat-table [dataSource]="tipoEquipamento().data.dados" class="table" [style.width]="'100%'" [style.table-layout]="'fixed'" style="min-width: 600px;">

    <ng-container matColumnDef="nmTipoEquipamento">
    <th mat-header-cell *matHeaderCellDef> Tipo de Equipamento </th>
    <td mat-cell *matCellDef="let dados">
      <span class="font-bold">
        {{dados?.nmTipoEquipamento}}
      </span>
     </td>
    </ng-container>

    <ng-container matColumnDef="dtDelecao">
      <th mat-header-cell *matHeaderCellDef> Data de Deleção </th>
      <td mat-cell *matCellDef="let dados">
        <mat-chip-set *ngIf="dados.dtDelecao">
          <mat-chip [class.chip-delecao]="dados.dtDelecao">
            <span [class.content-delecao]="dados.dtDelecao">
              {{dados.dtDelecao | date: 'dd/MM/yyyy hh:mm:ss'}}
            </span>
          </mat-chip>
        </mat-chip-set>
        <span *ngIf="!dados.dtDelecao">-</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="lgAtivo">
      <th mat-header-cell *matHeaderCellDef>Situação</th>
      <td mat-cell *matCellDef="let dados">
        <app-chip-status [lgAtivo]="dados.lgAtivo"></app-chip-status>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <no-table [dataSource]="tipoEquipamento()?.data?.dados" />

  <mat-paginator
   *ngIf="tipoEquipamento()?.data?.dados.length == pageSize || pageIndex != 0"
    [length]="dataLength"
    [pageSizeOptions]="[5, 10]"
    [pageSize]="pageSize"
    (page)="onPageChange($event)"
    aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
</div>
