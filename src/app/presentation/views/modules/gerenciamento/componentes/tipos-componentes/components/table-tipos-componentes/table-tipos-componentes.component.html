<div class="table-container max-h-[37em]">
  <table mat-table [dataSource]="tipoComponente()?.data?.dados" class="table" [style.width]="'100%'" [style.table-layout]="'fixed'" style="min-width: 600px;">

    <ng-container matColumnDef="nmTipoComponente">
    <th mat-header-cell *matHeaderCellDef> Tipo de Componente</th>
    <td mat-cell *matCellDef="let dados">
      <span class="font-bold">
        {{dados?.nmTipoComponente}}
      </span>
     </td>
    </ng-container>

    <ng-container matColumnDef="dtDelecao">
      <th mat-header-cell *matHeaderCellDef> Data de Deleção </th>
      <td mat-cell *matCellDef="let dados">
        <mat-chip-set *ngIf="dados.dtDelecao">
          <mat-chip [class.chip-delecao]="dados.dtDelecao">
            <span [class.content-delecao]="dados.dtDelecao">
              {{dados.dtDelecao | date: 'dd/MM/yyyy hh:mm:ss'}}
            </span>
          </mat-chip>
        </mat-chip-set>
        <span *ngIf="!dados.dtDelecao">-</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="lgAtivo">
      <th mat-header-cell *matHeaderCellDef>Situação</th>
      <td mat-cell *matCellDef="let dados">
        <mat-chip-set>
          <mat-chip #lgAtivo [class.chip-success]="dados.lgAtivo" [class.chip-danger]="!dados.lgAtivo">
            <i [class.content-success]="dados.lgAtivo" [class.content-danger]="!dados.lgAtivo" class="la la-check-circle" matChipAvatar *ngIf="dados.lgAtivo">
            </i>
            <i [class.content-success]="dados.lgAtivo" [class.content-danger]="!dados.lgAtivo" class="la la-times-circle" matChipAvatar *ngIf="!dados.lgAtivo">
            </i>
            <span [class.content-success]="dados.lgAtivo" [class.content-danger]="!dados.lgAtivo">
              {{ getSituacao(dados.lgAtivo) || "" }}
            </span>
          </mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <mat-paginator
    [length]="dataLength"
    [pageSizeOptions]="[5, 10]"
    [pageSize]="pageSize"
    (page)="onPageChange($event)"
    aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
</div>
