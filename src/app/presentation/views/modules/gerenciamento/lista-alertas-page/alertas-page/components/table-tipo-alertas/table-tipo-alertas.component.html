<div class="table-container max-h-[37em]">
    <table mat-table [dataSource]="tipoAlertas()?.data?.dados" class="table" [style.width]="'100%'" [style.table-layout]="'fixed'">

      <ng-container matColumnDef="nvCor">
        <th mat-header-cell *matHeaderCellDef> Cor </th>
        <td mat-cell *matCellDef="let dados">
          <span
            [style.background-color]="getColorByNivel(dados?.nvAlerta)"
            style="display: inline-block; width: 15px; height: 15px; border-radius: 50%;">
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="nmTipoAlerta">
        <th mat-header-cell *matHeaderCellDef> TIPO DE ALERTA </th>
        <td mat-cell *matCellDef="let dados">
          <span class="font-bold">
            <i class="la la-tag" style="font-size: medium;"></i>
            {{dados?.nmTipoAlerta}}
          </span>
          </td>
      </ng-container>

      <ng-container matColumnDef="dsTipoAlerta">
      <th mat-header-cell *matHeaderCellDef> Descrição </th>
      <td mat-cell *matCellDef="let dados">
          {{dados?.dsTipoAlerta}}
       </td>
      </ng-container>
      <ng-container matColumnDef="nvAlerta">
        <th mat-header-cell *matHeaderCellDef> Nível </th>
        <td mat-cell *matCellDef="let dados">
          <tvc-badge color="default">
            {{dados?.nvAlerta}}
          </tvc-badge>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
    </table>

  <no-table [dataSource]="tipoAlertas()?.data?.dados" />

  @if (!isLoading() && (tipoAlertas()?.data?.dados?.length ?? 0) > 0) {
    <mat-paginator
      [length]="dataLength"
      [pageSizeOptions]="[5, 10]"
      [pageSize]="pageSize"
      (page)="onPageChange($event)"
      aria-label="Selecione a página"
      showFirstLastButtons>
    </mat-paginator>
  }
</div>
