<div class="table-container max-h-[37em]">
  <table mat-table [dataSource]="alertas()?.data?.dados" class="table" [style.width]="'100%'"
    [style.table-layout]="'fixed'">

    <ng-container matColumnDef="nvCor">
      <th mat-header-cell *matHeaderCellDef> Cor </th>
      <td mat-cell *matCellDef="let dados">
        <span [style.background-color]="getColorByNivel(dados?.tipoAlertaQueryResponse.nvTipoAlerta)"
          style="display: inline-block; width: 15px; height: 15px; border-radius: 50%;">
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="nrPlaca">
      <th mat-header-cell *matHeaderCellDef> Placa </th>
      <td mat-cell *matCellDef="let dados">
        <span class="font-bold">
          <i class="la la-poll-h" style="font-size: medium;"></i>
          {{dados?.veiculoQueryResponse.nrPlaca}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="nmModelo">
      <th mat-header-cell *matHeaderCellDef> Modelo </th>
      <td mat-cell *matCellDef="let dados">
          {{dados?.veiculoQueryResponse.nmModelo ? dados.veiculoQueryResponse.nmModelo : '-'}}
      </td>
    </ng-container>

    <ng-container matColumnDef="nmTipoAlerta">
      <th mat-header-cell *matHeaderCellDef> Tipo de Alerta </th>
      <td mat-cell *matCellDef="let dados">
          {{dados?.tipoAlertaQueryResponse.nmTipoAlerta}}
      </td>
    </ng-container>


    <ng-container matColumnDef="dsAlerta">
      <th mat-header-cell *matHeaderCellDef> Descrição </th>
      <td mat-cell *matCellDef="let dados">
          {{dados?.dsAlerta}}
      </td>
    </ng-container>

    <ng-container matColumnDef="dtAlerta">
      <th mat-header-cell *matHeaderCellDef> Data de alerta </th>
      <td mat-cell *matCellDef="let dados">
        <tvc-badge color="default" size="normal">
          {{dados.dtAlerta | date: 'dd/MM/yyyy HH:mm:ss' }}
        </tvc-badge>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <no-table [dataSource]="alertas()?.data?.dados" />

  <mat-paginator *ngIf="alertas()?.data?.dados.length == pageSize || pageIndex != 0" [length]="dataLength"
    [pageSizeOptions]="[5, 10]" [pageSize]="pageSize" (page)="onPageChange($event)" aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
</div>
