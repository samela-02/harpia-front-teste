<div class="table-container max-h-[37em]">
  <table mat-table [dataSource]="listaAlertas()?.data?.dados" class="table" [style.width]="'100%'"
    [style.table-layout]="'fixed'" style="min-width: 600px;">

    <ng-container matColumnDef="nmListaAlerta">
      <th mat-header-cell *matHeaderCellDef> NOME </th>
      <td mat-cell *matCellDef="let dados">
        <span class="font-bold">
          <i class="la la-folder" style="font-size: medium;"></i>
          {{dados?.nmListaAlerta}}
        </span>
      </td>
    </ng-container>
    <ng-container matColumnDef="dsListaAlerta">
      <th mat-header-cell *matHeaderCellDef> Descrição </th>
      <td mat-cell *matCellDef="let dados">
          {{dados?.dsListaAlerta}}
      </td>
    </ng-container>

    <ng-container matColumnDef="idInstituicao">
      <th mat-header-cell *matHeaderCellDef> OBSERVAÇÃO </th>
      <td mat-cell *matCellDef="let dados"> {{dados?.idInstituicao}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="rowChange($event, row)"></tr>
  </table>

  <mat-paginator [length]="dataLength" [pageSizeOptions]="[5, 10]" [pageSize]="pageSize" (page)="onPageChange($event)"
    aria-label="Selecione a página" showFirstLastButtons>
  </mat-paginator>
</div>
