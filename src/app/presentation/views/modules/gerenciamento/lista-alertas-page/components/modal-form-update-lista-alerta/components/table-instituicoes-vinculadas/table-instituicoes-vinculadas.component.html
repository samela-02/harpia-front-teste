<div class="table-container max-h-[10em]">
  <table mat-table [dataSource]="instituicoes().data.dados" class="table" [style.width]="'100%'"
    [style.table-layout]="'fixed'">

    <ng-container matColumnDef="idInstituicao">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let dados">
        <span class="font-bold">
          <i class="la la-folder" style="font-size: medium;"></i>
          {{dados.idInstituicao}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="vinculada">
      <th mat-header-cell *matHeaderCellDef> Vinculada </th>
      <td mat-cell *matCellDef="let dados">
        <mat-slide-toggle
          [checked]="isVinculada(dados.idInstituicao)"
          (change)="onToggleChange($event, dados.idInstituicao)">
        </mat-slide-toggle>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['idInstituicao', 'vinculada']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['idInstituicao', 'vinculada'];" (click)="rowChange($event, row)" [class.cursor-pointer]="!row.isEditable"></tr>
  </table>

  <mat-paginator *ngIf="instituicoes()?.data?.dados.length == pageSize || pageIndex != 0" [length]="dataLength"
    [pageSizeOptions]="[4]" [pageSize]="4" (page)="onPageChange($event)" aria-label="Selecione a página"
    showFirstLastButtons>
  </mat-paginator>
  <!-- <no-table [dataSource]="instituicoesVinculadas" /> -->
</div>
