<span class="flex items-start gap-1 linha-horizonal">
  <i [class]="icone" class="mt-[2px]"></i>
  <span>
    <strong>
      {{titulo}}:
    </strong>
    <span #tooltip="matTooltip"
          [matTooltip]="descricao"
          [matTooltipDisabled]="descricao?.length <= truncate">
      {{descricao ? descricao : 'N/A' | truncate: truncate}}
    </span>
  </span>
</span>
