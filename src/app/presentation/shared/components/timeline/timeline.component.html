<div class="px-4 max-h-full overflow-y-auto">
    <ol class="relative border-s border-gray-200 dark:border-gray-700">
        @for (timeline of timelineList; track $index) {
            <li class="mb-10 ms-6">
                <div class="flex items-center justify-start">
                    <span class="mr-2"><i class="{{ timeline.eventIcon.iconValue }}"></i></span>
                    <h3 class="flex items-center mb-1 text-lg font-semibold text-gray-900 dark:text-white">{{ timeline.title }}</h3>
                </div>
                <time class="block mb-2 text-sm font-normal leading-none text-gray-400 dark:text-gray-500">{{ timeline.date | date: 'dd/MM/yyyy HH:mm:ss' }} - {{ timeline.user }}</time>
                <p class="mb-4 text-base font-normal text-gray-500 dark:text-gray-400">{{ timeline.content }}</p>
            </li>
        }
    </ol>
</div>
