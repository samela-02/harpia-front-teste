<div class="h-full w-full">
    <div id="map" class="h-full w-full rounded-lg border-none">
      <div class="layer-control absolute flex justify-end bottom-8 right-2 z-[1000] gap-2">
          <div class="relative">
            <div class="pt-1 px-1 rounded-full bg-white dark:bg-dark-container" (click)="openSettings = !openSettings">
              <mat-icon class="text-gray-500 dark:text-gray-300 transition-transform duration-300" [class.rotate-180]="openSettings">
                {{openSettings ? 'close' : 'settings'}}
              </mat-icon>
            </div>
            @if (openSettings) {
            <div class="absolute bottom-8 w-40 -right-[0.2rem] bg-white dark:bg-dark-container rounded-lg p-4 mb-1">
              <div class="space-y-3">
                <div class="flex flex-col gap-2">
                  <span class="text-sm font-medium">Estilo do Mapa</span>
                  <div class="flex flex-col gap-1">
                    @for (layer of optionsLayers; track layer; let i = $index) {
                    <div class="flex items-center gap-2">
                      <input type="radio" [id]="'layer-' + i" name="mapLayer" [checked]="layerSelected === layer"
                        (change)="toggleMapLayer(i)">
                      <label [for]="'layer-' + i" class="text-sm">{{layer.label}}</label>
                    </div>
                    }
                  </div>
                </div>
              </div>
            </div>
            }
          </div>
      </div>
    </div>
</div>
