<div class="p-4 border border-primary/20 relative rounded-md">
  <div class="absolute -top-[14px] px-1 bg-white dark:bg-dark-body" *ngIf="titulo ||icone">
    <span class="text-sm text-primary dark:text-dark-primary font-bold">
      <i [class]="icone"></i>
      <span class="dark:text-cyan-50">
        {{titulo}}
      </span>
    </span>
  </div>
  <div class="content">
    <ng-content></ng-content>
  </div>
</div>
